name: Render and publish SST report

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - uses: r-lib/actions/setup-pandoc@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libpng-dev \
            libtiff5-dev \
            libjpeg-dev \
            libharfbuzz-dev \
            libfribidi-dev \
            libnetcdf-dev \
            libudunits2-dev \
            libgdal-dev \
            libgeos-dev \
            libproj-dev

      - name: Install R packages
        shell: Rscript {0}
        run: |
          lib <- Sys.getenv("R_LIBS_USER")
          dir.create(lib, recursive = TRUE, showWarnings = FALSE)
          options(repos = c(CRAN = "https://packagemanager.posit.co/cran/__linux__/noble/latest"))
          install.packages(
            c('knitr', 'rmarkdown',
              'ggplot2', 'dplyr', 'tidyr', 'lubridate', 'readr', 'purrr',
              'ggsci', 'rerddap', 'giscoR'),
            lib = lib,
            dependencies = c('Depends', 'Imports', 'LinkingTo')
          )
          
      - name: Diagnose library
        shell: Rscript {0}
        run: |
          cat("R_LIBS_USER:", Sys.getenv("R_LIBS_USER"), "\n")
          cat("libPaths:\n")
          print(.libPaths())
          cat("rmarkdown installed:", "rmarkdown" %in% rownames(installed.packages()), "\n")

      - name: Test ERDDAP connectivity
        id: erddap_check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://pae-paha.pacioos.hawaii.edu/erddap/info/dhw_5km/index.csv")
          echo "status=$STATUS" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Render R Markdown
        if: steps.erddap_check.outputs.status == '200'
        shell: Rscript {0}
        run: |
          rmarkdown::render('sea_temps_ppb.Rmd', output_file = 'docs/index.html')

      - name: Commit updated data and HTML
        if: steps.erddap_check.outputs.status == '200'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add bay.Rdata docs/index.html
          git diff --staged --quiet || git commit -m "Daily update $(date -u '+%Y-%m-%d')"
          git pull --rebase origin main
          git push